# Local services.
#   docker compose up -d                  database, Redis and Mailpit only (run the app yourself with php artisan serve)
#   docker compose --profile app up -d    everything, including the app with a demo agency at http://tsf.localhost:8000
services:
  app:
    profiles: [app]
    build: .
    depends_on: [postgres, mailpit]
    ports: ["8000:8000"]
    environment:
      APP_URL: http://tsf.localhost:8000
      PLATFORM_BASE_DOMAIN: localhost     # browsers resolve *.localhost to this computer, so no hosts file is needed
      PLATFORM_REQUIRE_STAFF_MFA: "false" # demo only; production keeps two-step sign-in on
      DB_HOST: postgres
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      SEED_DEMO: "1"
    volumes:
      - appstorage:/app/storage/app

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata:
  appstorage:
